services:
  neo4j:
    image: neo4j:5.23
    container_name: graph-rag-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-please-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_MODEL_DEPS: ${INSTALL_MODEL_DEPS:-false}
    container_name: graph-rag-api
    depends_on:
      - neo4j
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-please-change-me}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      EMBEDDING_MODEL_PRIMARY: ${EMBEDDING_MODEL_PRIMARY:-nlpai-lab/KURE-v1}
      EMBEDDING_MODEL_CANDIDATES: ${EMBEDDING_MODEL_CANDIDATES:-dragonkue/BGE-m3-ko}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:-}
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX:-}
      EMBEDDING_FALLBACK_TO_HASH: ${EMBEDDING_FALLBACK_TO_HASH:-true}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-64}
      CHUNK_SIZE_DEFAULT: ${CHUNK_SIZE_DEFAULT:-2048}
      CHUNK_OVERLAP_DEFAULT: ${CHUNK_OVERLAP_DEFAULT:-256}
      CHUNK_SIZE_STRUCTURED: ${CHUNK_SIZE_STRUCTURED:-1024}
      CHUNK_OVERLAP_STRUCTURED: ${CHUNK_OVERLAP_STRUCTURED:-128}
      CHUNK_SIZE_MAX: ${CHUNK_SIZE_MAX:-3072}
      CHUNK_STRUCTURE_MIN_LINES: ${CHUNK_STRUCTURE_MIN_LINES:-3}
      CHUNK_STRUCTURE_HEADING_RATIO: ${CHUNK_STRUCTURE_HEADING_RATIO:-0.20}
      GRAPH_MAX_HOPS: ${GRAPH_MAX_HOPS:-3}
      GRAPH_BEAM_WIDTH: ${GRAPH_BEAM_WIDTH:-24}
      GRAPH_PRUNE_THRESHOLD: ${GRAPH_PRUNE_THRESHOLD:-0.10}
      TOP_K_DEFAULT: ${TOP_K_DEFAULT:-5}
    volumes:
      - ./:/workspace
      - ${HOME}/.codex:/host-home/.codex:ro
      - ${HOME}/.claude:/host-home/.claude:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  neo4j_data:
