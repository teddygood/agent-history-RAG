services:
  neo4j:
    image: neo4j:5.23
    container_name: graph-rag-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-please-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_MODEL_DEPS: ${INSTALL_MODEL_DEPS:-false}
    container_name: graph-rag-api
    depends_on:
      - neo4j
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-please-change-me}
    volumes:
      - ./:/workspace
      - ${HOME}/.codex:/host-home/.codex:ro
      - ${HOME}/.claude:/host-home/.claude:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  neo4j_data:
