<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph Conversation RAG Viewer</title>
    <link rel="stylesheet" href="/viewer/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>Graph-Centric RAG Explorer</h1>
        <p>Traceable turn retrieval over an entity relation graph</p>
      </header>

      <section class="controls">
        <div id="statusBanner" class="status-banner" aria-live="polite"></div>
        <div class="row">
          <label for="query">Query</label>
          <input id="query" value="continuous batching과 paged attention 관계 설명해줘" />
        </div>
        <div class="row row-grid">
          <div>
            <label for="topK">Top-K <span id="topKVal">5</span></label>
            <input id="topK" type="range" min="1" max="20" step="1" value="5" />
          </div>
          <div>
            <label for="seed">Graph Seed</label>
            <input id="seed" value="paged attention" />
          </div>
        </div>
        <div class="slider-grid">
          <div class="slider-item">
            <label for="maxHops">Max Hops <span id="maxHopsVal">3</span></label>
            <input id="maxHops" type="range" min="1" max="6" step="1" value="3" />
          </div>
          <div class="slider-item">
            <label for="beamWidth">Beam Width <span id="beamWidthVal">24</span></label>
            <input id="beamWidth" type="range" min="4" max="120" step="1" value="24" />
          </div>
          <div class="slider-item">
            <label for="pruneThreshold">Prune Threshold <span id="pruneThresholdVal">0.10</span></label>
            <input id="pruneThreshold" type="range" min="0.01" max="1.00" step="0.01" value="0.10" />
          </div>
          <div class="slider-item">
            <label for="importanceWeight">Importance Weight <span id="importanceWeightVal">0.18</span></label>
            <input id="importanceWeight" type="range" min="0.00" max="1.00" step="0.01" value="0.18" />
          </div>
          <div class="slider-item">
            <label for="recencyWeight">Recency Weight <span id="recencyWeightVal">0.12</span></label>
            <input id="recencyWeight" type="range" min="0.00" max="1.00" step="0.01" value="0.12" />
          </div>
        </div>
        <div class="slider-grid graph-slider-grid">
          <div class="slider-item">
            <label for="graphLimit">Graph Limit <span id="graphLimitVal">150</span></label>
            <input id="graphLimit" type="range" min="20" max="500" step="10" value="150" />
          </div>
          <div class="slider-item">
            <label for="graphLinkDistance">Link Distance <span id="graphLinkDistanceVal">95</span></label>
            <input id="graphLinkDistance" type="range" min="40" max="180" step="1" value="95" />
          </div>
          <div class="slider-item">
            <label for="graphRepulsion">Repulsion <span id="graphRepulsionVal">220</span></label>
            <input id="graphRepulsion" type="range" min="60" max="700" step="10" value="220" />
          </div>
          <div class="slider-item">
            <label for="graphNodeScale">Node Scale <span id="graphNodeScaleVal">1.0</span></label>
            <input id="graphNodeScale" type="range" min="0.5" max="2.0" step="0.1" value="1.0" />
          </div>
        </div>
        <div class="actions">
          <button id="runQuery">Run Query</button>
          <button id="loadGraph">Load Graph</button>
          <button id="ingestSample">Ingest Sample</button>
          <button id="ingestHistory">Ingest Agent History</button>
        </div>
      </section>

      <section class="content-grid">
        <article class="panel">
          <h2>Top Turns</h2>
          <div id="appliedParams" class="applied-params"></div>
          <ul id="turnList"></ul>
        </article>

        <article class="panel">
          <h2>Graph</h2>
          <div id="graphCanvas"></div>
        </article>
      </section>
    </div>

    <script type="module" src="/viewer/app.js"></script>
  </body>
</html>
